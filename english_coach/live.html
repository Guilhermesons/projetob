<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Buddy ao vivo</title><style>body{font:18px system-ui;background:#101a2c;color:#edf4ff;max-width:800px;margin:40px auto;padding:20px}button,select,input{font:inherit;padding:12px;border-radius:12px}button{background:#a8f0cb}section{background:#1c2b43;padding:24px;border-radius:20px;margin:20px 0}label{display:block;margin:16px 0}#log p{white-space:pre-wrap;border-bottom:1px solid #445;padding-bottom:16px}#status{color:#a8f0cb}</style>
<h1>🎙️ Buddy ao vivo</h1><p>Comece a falar para interromper o Buddy.</p><section>
<label>Modelo <select id="model"><option>qwen2.5:7b</option><option>qwen2.5:3b</option></select></label>
<label>Voz inglesa local <select id="voice"></select></label>
<label>Pausa para enviar (ms) <input id="pause" type="number" min="500" max="1800" value="950"></label>
<label>Limiar de som (menor = mais sensível) <input id="threshold" type="range" min="0.005" max="0.08" value="0.018" step="0.001"></label>
<button id="start">Iniciar conversa</button> <button id="stop" disabled>Encerrar</button><p id="status" role="status">Microfone desligado.</p><small>Use fones para evitar eco. Ruído pode interromper. Apenas vozes locais são usadas.</small></section><section id="log" aria-live="polite"></section>
<script>
const $=id=>document.getElementById(id);let socket,stream,ctx,processor,source,sink,active=false,id=0,frames=[],pre=[],speaking=false,hot=0,quiet=0,total=0,reply='',pending='',bubble,voices=[];
function status(t){$('status').textContent=t}function add(who,text){const p=document.createElement('p');p.textContent=who+': '+text;$('log').append(p);return p}
function listVoices(){voices=speechSynthesis.getVoices().filter(v=>v.localService&&v.lang.startsWith('en'));$('voice').replaceChildren(...voices.map((v,i)=>new Option(v.name+' ('+v.lang+')',i)))}speechSynthesis.onvoiceschanged=listVoices;listVoices();
function say(text){if(!active||!text.trim())return;const u=new SpeechSynthesisUtterance(text);u.voice=voices[Number($('voice').value)];if(!u.voice){status('Selecione uma voz local.');return}u.lang=u.voice.lang;u.rate=.95;const current=id;u.onstart=()=>{if(current===id)status('Buddy falando — pode interromper.')};u.onend=()=>{if(current===id&&!speechSynthesis.speaking)status('Ouvindo…')};speechSynthesis.speak(u)}
function flush(final=false){let m;while((m=pending.match(/^([\s\S]*?[.!?](?:\s|$))/))){say(m[1]);pending=pending.slice(m[1].length)}if(final){say(pending);pending=''}}
function interrupt(){id++;speechSynthesis.cancel();pending='';reply='';bubble=null;socket.send(JSON.stringify({type:'interrupt',id}));status('Ouvindo você…')}
function wav(chunks){const length=chunks.reduce((n,a)=>n+a.length,0);const b=new ArrayBuffer(44+length*2),v=new DataView(b);function str(o,s){for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}str(0,'RIFF');v.setUint32(4,36+length*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,ctx.sampleRate,true);v.setUint32(28,ctx.sampleRate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,length*2,true);let o=44;for(const a of chunks)for(const x of a){v.setInt16(o,Math.max(-1,Math.min(1,x))*32767,true);o+=2}let s='';for(const byte of new Uint8Array(b))s+=String.fromCharCode(byte);return btoa(s)}
function capture(event){if(!active)return;const a=new Float32Array(event.inputBuffer.getChannelData(0));const ms=a.length/ctx.sampleRate*1000;const rms=Math.sqrt(a.reduce((s,x)=>s+x*x,0)/a.length);const loud=rms>Number($('threshold').value);if(!speaking){pre.push(a);if(pre.length>6)pre.shift();hot=loud?hot+ms:0;if(hot<140)return;interrupt();speaking=true;frames=pre.slice();pre=[];total=hot;quiet=0;return}frames.push(a);total+=ms;quiet=loud?0:quiet+ms;if(quiet>=Math.max(500,Math.min(1800,Number($('pause').value)||950))||total>=20000){speaking=false;hot=0;const audio=wav(frames);frames=[];socket.send(JSON.stringify({type:'audio',id,audio,model:$('model').value}));status('Pensando…')}}
async function stop(){active=false;id++;speechSynthesis.cancel();if(socket)socket.close();if(stream)stream.getTracks().forEach(t=>t.stop());if(processor)processor.disconnect();if(source)source.disconnect();if(sink)sink.disconnect();if(ctx&&ctx.state!=='closed')await ctx.close();frames=[];pre=[];speaking=false;hot=0;pending='';$('start').disabled=false;$('stop').disabled=true;status('Microfone desligado.')}
$('stop').onclick=stop;
$('start').onclick=async()=>{try{if(!voices.length)throw Error('Instale uma voz inglesa local no Windows e reabra o navegador.');$('start').disabled=true;status('Abrindo microfone…');stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});ctx=new AudioContext();await ctx.resume();socket=new WebSocket('ws://'+location.host+'/voice');await new Promise((ok,fail)=>{socket.onopen=ok;socket.onerror=()=>fail(Error('Servidor indisponível'))});active=true;$('stop').disabled=false;socket.onclose=()=>{if(active)stop().then(()=>status('Conexão encerrada. Inicie novamente.'))};socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.id!==id||!active)return;if(m.type==='status'||m.type==='error')status(m.text);if(m.type==='transcript'){add('Você',m.text);bubble=add('Buddy','');reply='';pending=''}if(m.type==='chunk'){reply+=m.text;pending+=m.text;if(bubble)bubble.textContent='Buddy: '+reply;flush()}if(m.type==='done')flush(true)};source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(2048,1,1);sink=ctx.createGain();sink.gain.value=0;processor.onaudioprocess=capture;source.connect(processor);processor.connect(sink);sink.connect(ctx.destination);status('Ouvindo… Pode começar!')}catch(e){await stop();status(e.message)}};
window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());speechSynthesis.cancel();if(socket)socket.close()});
</script></html>
